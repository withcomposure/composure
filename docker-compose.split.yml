services:
  composure:
    build:
      target: api-only
    environment:
      SERVE_FRONTEND: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN to your deployed frontend origin (for example https://your-app.pages.dev)}
      FRONTEND_URL: ${FRONTEND_URL:-}
      BACKEND_URL: ${BACKEND_URL:-}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-}
      GUEST_COOKIE_SAME_SITE: ${GUEST_COOKIE_SAME_SITE:-}
