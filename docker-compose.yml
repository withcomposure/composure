services:
  db:
    image: postgres:17
    ports:
      - "${PG_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=composure
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - composure-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  composure:
    extends:
      file: docker-compose.nodb.yml
      service: composure
    depends_on:
      db:
        condition: service_healthy
      compiler-1:
        condition: service_healthy
      compiler-2:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@db:5432/composure}
  compiler-1:
    extends:
      file: docker-compose.nodb.yml
      service: compiler-1
  compiler-2:
    extends:
      file: docker-compose.nodb.yml
      service: compiler-2
networks:
  composure-internal:
    driver: bridge
volumes:
  pgdata: