services:
  composure:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      compiler-1:
        condition: service_healthy
      compiler-2:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      PORT: 8080
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      BACKEND_URL: ${BACKEND_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-}
      GUEST_COOKIE_SAME_SITE: ${GUEST_COOKIE_SAME_SITE:-}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
      JWT_ISSUER: ${JWT_ISSUER:-}
      API_BASE_PATH: ${API_BASE_PATH:-/api}
      SERVE_FRONTEND: ${SERVE_FRONTEND:-true}
      COMPILERS: http://compiler-1:4000,http://compiler-2:4000
    restart: unless-stopped
    networks:
      - composure-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  compiler-1:
    build:
      context: .
      dockerfile: compiler/Dockerfile
    environment:
      - PORT=4000
      - COMPILE_DIR=/var/composure/compiles
      - TECTONIC_CACHE=/var/composure/caches/tectonic
      - TYPST_CACHE=/var/composure/caches/typst
      - ASSETS_DIR=/app/data/assets
      - MAX_CONCURRENT_PROJECTS=4
    volumes:
      - ./data/assets:/app/data/assets:ro
      - ./data/compiles/compiler-1:/var/composure/compiles
      - ./data/caches/tectonic:/var/composure/caches/tectonic
      - ./data/caches/typst:/var/composure/caches/typst
    restart: unless-stopped
    networks:
      - composure-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
  compiler-2:
    build:
      context: .
      dockerfile: compiler/Dockerfile
    environment:
      - PORT=4000
      - COMPILE_DIR=/var/composure/compiles
      - TECTONIC_CACHE=/var/composure/caches/tectonic
      - TYPST_CACHE=/var/composure/caches/typst
      - ASSETS_DIR=/app/data/assets
      - MAX_CONCURRENT_PROJECTS=4
    volumes:
      - ./data/assets:/app/data/assets:ro
      - ./data/compiles/compiler-2:/var/composure/compiles
      - ./data/caches/tectonic:/var/composure/caches/tectonic
      - ./data/caches/typst:/var/composure/caches/typst
    restart: unless-stopped
    networks:
      - composure-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
networks:
  composure-internal:
    driver: bridge